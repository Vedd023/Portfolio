  <text x="44" y="98" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#888" letter-spacing="1">PAYLOAD CONFIGURATION</text>
  
  <!-- Input box -->
  <text x="44" y="128" font-family="'JetBrains Mono', monospace" font-size="10" fill="#666">DESTINATION URL / TEXT</text>
  <rect x="44" y="136" width="270" height="36" rx="3" fill="#1c1c1c" stroke="#E65335" stroke-width="1.2"/>
  <text x="56" y="159" font-family="'JetBrains Mono', monospace" font-size="11" fill="#EDEDED">https://vedd023.github.io/portfolio</text>

