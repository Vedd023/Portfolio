  <text x="272" y="437" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ddd" text-anchor="middle">EPS ↓</text>

  <text x="44" y="482" font-family="'JetBrains Mono', monospace" font-size="9" fill="#555">Client-side rendering · Zero latency · Offline ready</text>

