  <text x="86" y="437" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">PNG ↓</text>
  <rect x="137" y="417" width="84" height="32" rx="3" fill="#202020" stroke="#3a3a3a"/>
  <text x="179" y="437" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ddd" text-anchor="middle">SVG ↓</text>
