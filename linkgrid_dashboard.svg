  <text x="539" y="468" font-family="'JetBrains Mono', monospace" font-size="10" fill="#777" text-anchor="middle">Encoding: Byte (42 bytes payload) · Mask: Pattern 010</text>
  <text x="539" y="488" font-family="'JetBrains Mono', monospace" font-size="9" fill="#555" text-anchor="middle">Verification scan passed (100% decode rate)</text>

