<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="lg-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E65335"/>
      <stop offset="100%" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="lg-qr-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E65335" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#lg-bg)"/>
  <rect x="0" y="0" width="960" height="540" fill="none" stroke="#222" stroke-width="2"/>

  <!-- Top App Header -->
  <rect x="0" y="0" width="960" height="48" fill="#181818" stroke="#262626" stroke-width="1"/>
  <circle cx="28" cy="24" r="5" fill="#E65335"/>
  <text x="44" y="28" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#EDEDED" letter-spacing="1.5">LINKGRID</text>
  <text x="135" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#777">// QR &amp; LINK SUITE</text>
  
  <rect x="290" y="14" width="75" height="22" rx="3" fill="#222" stroke="#333"/>
  <text x="327" y="29" font-family="'JetBrains Mono', monospace" font-size="10" fill="#EDEDED" text-anchor="middle">QR CODE</text>
