  <text x="485" y="29" font-family="'JetBrains Mono', monospace" font-size="10" fill="#666">ANALYTICS</text>
  
  <rect x="810" y="14" width="125" height="22" rx="11" fill="#1b281d" stroke="#2e4e33"/>
  <circle cx="824" cy="25" r="4" fill="#4caf50" filter="url(#glow)"/>
