  <rect x="758" y="256" width="164" height="60" rx="3" fill="#1b1b1b" stroke="#2a2a2a"/>
  <text x="770" y="274" font-family="'JetBrains Mono', monospace" font-size="9" fill="#777">ERROR MARGIN</text>
  <text x="770" y="300" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#EDEDED">30.0 <tspan font-size="11" fill="#888">%</tspan></text>

