  <rect x="44" y="270" width="202" height="24" rx="3" fill="#262626"/>
  <text x="145" y="286" font-family="'JetBrains Mono', monospace" font-size="10" fill="#EDEDED" text-anchor="middle">LEVEL H (30% RESTORE)</text>

  <text x="44" y="322" font-family="'JetBrains Mono', monospace" font-size="10" fill="#666">MATRIX RESOLUTION &amp; DOT SHAPE</text>
  <rect x="44" y="332" width="130" height="26" rx="3" fill="#202020" stroke="#333"/>
  <text x="109" y="349" font-family="'JetBrains Mono', monospace" font-size="10" fill="#bbb" text-anchor="middle">1024 x 1024 px</text>
